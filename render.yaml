services:
  - type: web
    name: cinematch-api
    runtime: python
    region: oregon
    plan: free

    # Artifacts are committed to the repo and cloned by Render automatically.
    # No download step needed — just install deps and start.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: ARTIFACT_DIR
        value: /opt/render/project/src/recommender/artifacts

      - key: DEVICE
        value: cpu

      # REDIS_URL is a secret — add it in the Render dashboard under
      # Environment → Add Environment Variable (not stored in source control).
      - key: REDIS_URL
        sync: false
